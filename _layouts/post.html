---
layout: default
---

<article class="blog-post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%d/%m/%Y" }} • {% if site.authors[page.author] %}{{ site.authors[page.author].name }}{% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
