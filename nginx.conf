server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : le HTML et le CSS de ce site sont très compressibles.
    # (Inutile sur mp4/jpg/png, déjà compressés — d'où la liste explicite.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # --- Politique de cache ---
    #
    # Aucun fichier de ce site n'a de hash dans son nom (scrapbook.css,
    # tiny-planet.mp4... gardent le même nom d'une version à l'autre). Un
    # `immutable` longue durée figerait donc l'ancienne version chez les
    # visiteurs déjà venus, sans moyen de les rattraper. Les durées ci-dessous
    # sont calées sur "à quel point c'est grave si le visiteur voit la version
    # d'avant" plutôt que sur le poids du fichier.

    # Médias : lourds, et on ne remplace pas une photo ou une vidéo en place —
    # on en publie une nouvelle. 30 jours sans revalidation.
    # NB : pas de directive `expires` ici — elle émet son propre
    # `Cache-Control: max-age=...`, ce qui donnait deux en-têtes Cache-Control
    # concurrents sur la même réponse. On n'en garde qu'un seul, explicite.
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # CSS/JS : légers (~21 Ko), mais ce sont eux qui changent lors d'une
    # refonte. `no-cache` = le navigateur garde le fichier mais redemande à
    # chaque fois s'il a changé ; nginx répond 304 (quelques octets) tant que
    # c'est identique. On paie un aller-retour, jamais le fichier entier, et
    # une modif de style est visible immédiatement.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        # Le HTML doit toujours refléter le dernier déploiement : même logique
        # de revalidation que le CSS.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
