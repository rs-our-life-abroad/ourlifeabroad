# Configuration du site Our Life Abroad
title: Our Life Abroad
email: contact@ourlifeabroad.com
description: >-
  Couple français en slow travel à travers l'Amérique du Sud et l'Asie.
  Budgets réels, galères authentiques, bons plans testés.

url: "https://ourlifeabroad.crea-dapp.com"
baseurl: ""

# Langues disponibles
languages: ["fr", "en"]
default_lang: en

# Informations des auteurs
authors:
  romain:
    name: Romain
    bio: "Passionné de voyage et aventure. Expert en bons plans budget et équipement nomade."
    avatar: /assets/images/romain.jpg
    instagram: ""   # placeholder retire le 14/09/2026 - remettre le vrai compte si besoin
  
  partner:
    name: Steph
    bio: "[Une phrase sur elle/lui]"
    avatar: /assets/images/partner.jpg
    instagram: ""

# Réseaux sociaux
# Laisser vide tant que le compte n'existe pas : les {% if %} de _layouts/default.html
# masquent alors l'icone. Un placeholder ici produit un lien mort sur les 65 pages du
# site, invisible pour html-proofer (ces URL renvoient 200). Vide le 14/09/2026.
social:
  instagram: ""
  youtube: ""
  tiktok: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Collections pour les destinations, les pays et les redirections affiliées
collections:
  destinations:
    output: true
  countries:
    output: true
  redirects:
    output: true

# Umami analytics (instance partagée stats.crea-dapp.com)
# Laisser vide tant que le site n'a pas été ajouté au dashboard Umami.
umami_website_id: ""

# Paramètres par défaut
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: romain

  - scope:
      path: "fr"
    values:
      lang: fr

  - scope:
      path: "en"
    values:
      lang: en

  - scope:
      path: ""
      type: "redirects"
    values:
      layout: "redirect"
      rel: "sponsored nofollow noopener"