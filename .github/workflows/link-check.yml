name: Link check

on:
  push:
    branches: [main]
  schedule:
    # Chaque lundi 6h UTC - detecte le "link rot" cote partenaires (hors de nos commits)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  html-proofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Install html-proofer
        run: gem install html-proofer

      - name: Build site
        run: bundle exec jekyll build

      - name: Check links
        run: |
          htmlproofer \
            --assume-extension \
            --ignore-status-codes="429" \
            --ignore-urls="/instagram\.com/" \
            ./_site
        # --ignore-urls="/instagram\.com/" : Instagram bloque les IP des runners
        # GitHub Actions (429) par mesure anti-bot, alors que le même lien répond
        # 200 depuis une IP résidentielle. Un essai précédent de --ignore-urls sur
        # "instagram.com" (sans les slashes) échouait car html-proofer ne traite
        # une valeur --ignore-urls comme une regex QUE si elle est encadrée par
        # des "/" ; sans ça, c'est une égalité stricte sur l'URL entière, qui ne
        # matche donc jamais rien (cf. lib/html_proofer/attribute/url.rb). Le
        # format "/pattern/" saute la requête HTTP avant même qu'elle parte —
        # contrairement à --ignore-status-codes, qui dépend d'obtenir un vrai 429
        # (peu fiable en pratique sous requêtes concurrentes, cf. progress.md).
        # --ignore-status-codes="429" reste en place en filet de sécurité pour de
        # futurs domaines partenaires (booking, airbnb, amazon...) qui
        # bloqueraient le bot pareil, en attendant de leur ajouter leur propre
        # --ignore-urls si besoin.
        # Le chemin (PATH) doit rester en dernier argument : les options de type
        # liste (--ignore-status-codes, --ignore-urls) sont gourmandes et
        # avaleraient sinon le chemin.
