name: Link check

on:
  push:
    branches: [main]
  schedule:
    # Chaque lundi 6h UTC - detecte le "link rot" cote partenaires (hors de nos commits)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  html-proofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Install html-proofer
        run: gem install html-proofer

      - name: Build site
        run: bundle exec jekyll build

      - name: Check links
        run: |
          htmlproofer \
            --assume-extension \
            --ignore-status-codes="429" \
            ./_site
        # --ignore-status-codes="429" : Instagram (et d'autres réseaux sociaux)
        # renvoient 429 (rate limit) aux IP des runners GitHub Actions par mesure
        # anti-bot, alors que le même lien répond 200 depuis une IP résidentielle.
        # Un --ignore-urls sur le pattern instagram.com a été testé et s'est avéré
        # peu fiable ici (le lien réapparaissait quand même dans les échecs) ;
        # ignorer le code 429 est plus direct et couvre aussi les futurs domaines
        # partenaires (booking, airbnb, amazon...) qui bloqueraient le bot pareil.
        # Si un domaine renvoie un vrai 403/404, l'ajouter séparément via
        # --ignore-urls plutôt que d'élargir --ignore-status-codes.
        # Le chemin (PATH) doit rester en dernier argument : les options de type
        # liste (--ignore-status-codes) sont gourmandes et avaleraient sinon le
        # chemin.
