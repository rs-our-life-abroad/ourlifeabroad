<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Bouton « Texte centré » dans le + de l'éditeur. markdown="1" fait
    // interpréter le contenu par kramdown ; le style est dans scrapbook.css.
    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    // Aperçu (volet de droite) aligné comme le site : articles justifiés, blocs centrés
    CMS.registerPreviewStyle(`
      p { text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
      .text-center, .text-center p { text-align: center; }
      .spacer-s { height: 1.5rem; } .spacer-m { height: 3rem; } .spacer-l { height: 5rem; }
    `, { raw: true });
    CMS.registerEditorComponent({
      id: 'text-center',
      label: 'Texte centré',
      fields: [{ name: 'text', label: 'Texte', widget: 'text' }],
      pattern: /^<div class="text-center" markdown="1">\n([\s\S]*?)\n<\/div>$/ms,
      fromBlock: match => ({ text: match[1] }),
      toBlock: data => `<div class="text-center" markdown="1">\n${data.text || ''}\n</div>`,
      toPreview: data => `<div class="text-center" style="text-align: center; white-space: pre-line;">${escapeHtml(data.text || '')}</div>`,
    });
    // Bouton « Espace » : un blanc vertical, en markdown les lignes vides en trop sont ignorées
    CMS.registerEditorComponent({
      id: 'spacer',
      label: 'Espace',
      fields: [{
        name: 'size', label: 'Taille', widget: 'select', default: 'm',
        options: [{ label: 'Petit', value: 's' }, { label: 'Moyen', value: 'm' }, { label: 'Grand', value: 'l' }],
      }],
      pattern: /^<div class="spacer spacer-(s|m|l)"><\/div>$/m,
      fromBlock: match => ({ size: match[1] }),
      toBlock: data => `<div class="spacer spacer-${data.size || 'm'}"></div>`,
      toPreview: data => `<div class="spacer spacer-${data.size || 'm'}"></div>`,
    });
  </script>
  
  <script>
    window.addEventListener('message', function(event) {
      if (typeof event.data === 'string' && event.data.startsWith('authorization:github:success:')) {
        
        try {
          const tokenData = event.data.replace('authorization:github:success:', '');
          const parsed = JSON.parse(tokenData);
          
          
          if (parsed.token) {
            // Format correct pour Decap CMS avec backend GitHub
            const authData = {
              token: parsed.token,
              provider: 'github',
              backendName: 'github'
            };
            
            // Stocker dans le bon format
            localStorage.setItem('decap-cms-user', JSON.stringify(authData));
            
            // Aussi dans le format legacy au cas où
            localStorage.setItem('netlify-cms-user', JSON.stringify(authData));
            
            console.log('Token stored in localStorage');
            
            // Recharger après un court délai
            setTimeout(() => {
              console.log('Reloading page...');
              window.location.href = window.location.pathname;
            }, 1000);
          }
        } catch (error) {
          console.error('Error processing auth:', error);
        }
      }
    }, false);
    
  </script>
</body>
</html>
