<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    window.addEventListener('message', function(event) {
      if (typeof event.data === 'string' && event.data.startsWith('authorization:github:success:')) {
        console.log('Auth message received:', event.data);
        
        try {
          const tokenData = event.data.replace('authorization:github:success:', '');
          const parsed = JSON.parse(tokenData);
          
          console.log('Token parsed:', parsed);
          
          if (parsed.token) {
            // Format correct pour Decap CMS avec backend GitHub
            const authData = {
              token: parsed.token,
              provider: 'github',
              backendName: 'github'
            };
            
            // Stocker dans le bon format
            localStorage.setItem('decap-cms-user', JSON.stringify(authData));
            
            // Aussi dans le format legacy au cas où
            localStorage.setItem('netlify-cms-user', JSON.stringify(authData));
            
            console.log('Token stored in localStorage');
            console.log('Stored data:', authData);
            
            // Recharger après un court délai
            setTimeout(() => {
              console.log('Reloading page...');
              window.location.href = window.location.pathname;
            }, 1000);
          }
        } catch (error) {
          console.error('Error processing auth:', error);
        }
      }
    }, false);
    
    // Debug: afficher ce qui est dans localStorage au chargement
    console.log('localStorage check:');
    console.log('decap-cms-user:', localStorage.getItem('decap-cms-user'));
    console.log('netlify-cms-user:', localStorage.getItem('netlify-cms-user'));
  </script>
</body>
</html>
