backend:
  name: github
  repo: rs-our-life-abroad/ourlifeabroad
  branch: main
  base_url: https://ourlifeabroad-oauth.coding-training-pers.workers.dev
  auth_endpoint: /auth

# Brouillons : Save enregistre sans publier (branche + pull request cms/...),
# la mise en ligne se fait depuis l'onglet Workflow.
publish_mode: editorial_workflow

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "posts_fr"
    label: "Articles (FR)"
    folder: "_posts"
    create: true
    filter:
      field: lang
      value: fr
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Langue", name: "lang", widget: "hidden", default: "fr" }
      - { label: "Auteur", name: "author", widget: "select", options: ["romain", "steph"] }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "posts_en"
    label: "Articles (EN)"
    folder: "_posts"
    create: true
    filter:
      field: lang
      value: en
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Author", name: "author", widget: "select", options: ["romain", "steph"] }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "destinations_fr"
    label: "Destinations (FR)"
    folder: "_destinations"
    create: true
    filter:
      field: lang
      value: fr
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Langue", name: "lang", widget: "hidden", default: "fr" }
      - { label: "Nom court (carte)", name: "place", widget: "string", hint: "Libellé affiché sur les cartes, ex. \"Bali\", \"Buenos Aires\"" }
      - { label: "Pays", name: "country", widget: "select", options: ["Pérou", "Argentine", "Paraguay", "Indonésie", "Philippines", "Thaïlande", "Vietnam", "Australie"] }
      - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
      - { label: "Drapeau", name: "flag", widget: "string" }
      - { label: "Date de visite", name: "date_visited", widget: "string" }
      - { label: "Durée", name: "duration", widget: "string" }
      - { label: "Point fort", name: "highlight", widget: "string" }
      - { label: "Budget/jour", name: "budget_day", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Image de couverture", name: "cover_image", widget: "image", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "destinations_en"
    label: "Destinations (EN)"
    folder: "_destinations"
    create: true
    filter:
      field: lang
      value: en
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Short name (card)", name: "place", widget: "string", hint: "Label shown on cards, e.g. \"Bali\", \"Buenos Aires\"" }
      - { label: "Country", name: "country", widget: "select", options: ["Peru", "Argentina", "Paraguay", "Indonesia", "Philippines", "Thailand", "Vietnam", "Australia"] }
      - { label: "Continent", name: "continent", widget: "select", options: ["asia", "south-america", "oceania", "europe"] }
      - { label: "Flag", name: "flag", widget: "string" }
      - { label: "Date visited", name: "date_visited", widget: "string" }
      - { label: "Duration", name: "duration", widget: "string" }
      - { label: "Highlight", name: "highlight", widget: "string" }
      - { label: "Budget/day", name: "budget_day", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "countries_fr"
    label: "Pays (FR)"
    folder: "_countries"
    create: true
    filter:
      field: lang
      value: fr
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Langue", name: "lang", widget: "hidden", default: "fr" }
      - { label: "Pays", name: "country", widget: "select", options: ["Pérou", "Argentine", "Paraguay", "Indonésie", "Philippines", "Thaïlande", "Vietnam", "Australie"] }
      - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
      - { label: "Drapeau", name: "flag", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Image de couverture", name: "cover_image", widget: "image", required: false }
      - { label: "Introduction", name: "body", widget: "markdown", required: false }

  - name: "countries_en"
    label: "Countries (EN)"
    folder: "_countries"
    create: true
    filter:
      field: lang
      value: en
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Country", name: "country", widget: "select", options: ["Peru", "Argentina", "Paraguay", "Indonesia", "Philippines", "Thailand", "Vietnam", "Australia"] }
      - { label: "Continent", name: "continent", widget: "select", options: ["asia", "south-america", "oceania", "europe"] }
      - { label: "Flag", name: "flag", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Introduction", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about_fr"
        label: "Qui sommes-nous ? (FR)"
        file: "fr/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "about" }
          - { label: "Langue", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/about/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - { label: "Grand titre", name: "heading", widget: "string" }
          - label: "Nous deux"
            name: "team"
            widget: "list"
            fields:
              - { label: "Prénom", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Spécialité", name: "specialty", widget: "string" }
          - { label: "Texte de la page", name: "body", widget: "markdown" }
      - name: "about_en"
        label: "About Us (EN)"
        file: "en/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "about" }
          - { label: "Language", name: "lang", widget: "hidden", default: "en" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/en/about/" }
          - { label: "Browser tab title", name: "title", widget: "string" }
          - { label: "Main heading", name: "heading", widget: "string" }
          - label: "The two of us"
            name: "team"
            widget: "list"
            fields:
              - { label: "First name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Specialty", name: "specialty", widget: "string" }
          - { label: "Page text", name: "body", widget: "markdown" }
      - name: "home_fr"
        label: "Accueil (FR)"
        file: "fr/index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "home" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - { label: "Grand titre", name: "intro_title", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - { label: "Titre « parcours »", name: "journey_title", widget: "string" }
          - label: "Cartes du parcours"
            name: "journey"
            widget: "list"
            fields:
              - { label: "Emoji", name: "icon", widget: "string" }
              - { label: "Titre", name: "name", widget: "string" }
              - { label: "Lieux", name: "places", widget: "string" }
              - { label: "Lien (optionnel)", name: "link", widget: "string", required: false }
          - { label: "Titre « derniers articles »", name: "posts_title", widget: "string" }
          - { label: "Texte de fin de page", name: "body", widget: "markdown" }
      - name: "home_en"
        label: "Home (EN)"
        file: "en/index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "home" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "en" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/en/" }
          - { label: "Browser tab title", name: "title", widget: "string" }
          - { label: "Main heading", name: "intro_title", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - { label: "Journey heading", name: "journey_title", widget: "string" }
          - label: "Journey cards"
            name: "journey"
            widget: "list"
            fields:
              - { label: "Emoji", name: "icon", widget: "string" }
              - { label: "Title", name: "name", widget: "string" }
              - { label: "Places", name: "places", widget: "string" }
              - { label: "Link (optional)", name: "link", widget: "string", required: false }
          - { label: "Latest posts heading", name: "posts_title", widget: "string" }
          - { label: "End-of-page text", name: "body", widget: "markdown" }
      - name: "guides_fr"
        label: "Guides (FR)"
        file: "fr/guides.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "guides" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/guides/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - { label: "Grand titre", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - label: "Catégories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Couleur des boutons", name: "color", widget: "select", options: [{ label: "Violet", value: "violet" }, { label: "Rose", value: "rose" }, { label: "Bleu", value: "bleu" }, { label: "Vert pastel", value: "pastel" }] }
              - label: "Guides"
                name: "guides"
                widget: "list"
                fields:
                  - { label: "Emoji", name: "icon", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "string" }
                  - { label: "Libellé du chiffre clé", name: "highlight_label", widget: "string", required: false }
                  - { label: "Valeur", name: "highlight_value", widget: "string", required: false }
                  - { label: "Lien vers le guide", name: "link", widget: "string" }
          - { label: "Texte de fin de page", name: "body", widget: "markdown" }
      - name: "guides_en"
        label: "Guides (EN)"
        file: "en/guides.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "guides" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "en" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/en/guides/" }
          - { label: "Browser tab title", name: "title", widget: "string" }
          - { label: "Main heading", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Button colour", name: "color", widget: "select", options: [{ label: "Violet", value: "violet" }, { label: "Rose", value: "rose" }, { label: "Bleu", value: "bleu" }, { label: "Vert pastel", value: "pastel" }] }
              - label: "Guides"
                name: "guides"
                widget: "list"
                fields:
                  - { label: "Emoji", name: "icon", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "string" }
                  - { label: "Key figure label", name: "highlight_label", widget: "string", required: false }
                  - { label: "Value", name: "highlight_value", widget: "string", required: false }
                  - { label: "Link to the guide", name: "link", widget: "string" }
          - { label: "End-of-page text", name: "body", widget: "markdown" }
      - name: "destinations_page_fr"
        label: "Page Destinations (FR)"
        file: "fr/destinations.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/destinations/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - { label: "Grand titre", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
      - name: "destinations_page_en"
        label: "Page Destinations (EN)"
        file: "en/destinations.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "en" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/en/destinations/" }
          - { label: "Browser tab title", name: "title", widget: "string" }
          - { label: "Main heading", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "markdown" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asia", "south-america", "oceania", "europe"] }
      - name: "continent_asie"
        label: "Continent : Asie (FR)"
        file: "fr/destinations/asie.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/destinations/asie/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
              - { label: "Description", name: "description", widget: "string", required: false }
      - name: "continent_amerique-sud"
        label: "Continent : Amérique du Sud (FR)"
        file: "fr/destinations/amerique-sud.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/destinations/amerique-sud/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
              - { label: "Description", name: "description", widget: "string", required: false }
      - name: "continent_oceanie"
        label: "Continent : Océanie (FR)"
        file: "fr/destinations/oceanie.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/destinations/oceanie/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
              - { label: "Description", name: "description", widget: "string", required: false }
      - name: "continent_europe"
        label: "Continent : Europe (FR)"
        file: "fr/destinations/europe.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "continents" }
          - { label: "Lang", name: "lang", widget: "hidden", default: "fr" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/fr/destinations/europe/" }
          - { label: "Titre de l'onglet", name: "title", widget: "string" }
          - label: "Continents"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Continent", name: "continent", widget: "select", options: ["asie", "amerique-sud", "oceanie", "europe"] }
              - { label: "Description", name: "description", widget: "string", required: false }
